[tox]
envlist = py, flake8

[travis]
python =
    3.8: py38
    3.7: py37
    3.6: py36

[testenv:flake8]
basepython = python
deps = flake8
commands = flake8 secureenclave tests

[testenv]
setenv =
    PYTHONPATH = {toxinidir}
    PYTHONWARNINGS = ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning,ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning,ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning
deps =
    -r{toxinidir}/requirements_dev.txt
; If you want to make tox run the tests with the same versions, create a
; requirements.txt with the pinned versions and uncomment the following line:
;     -r{toxinidir}/requirements.txt
commands =
    pip install -U pip
    pytest --basetemp={envtmpdir}
